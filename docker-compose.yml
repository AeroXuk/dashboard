name: dashboard

services:
  dashboard:
    image: ghcr.io/aeroxuk/dashboard:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config:ro # config.yaml (never written by the dashboard)
      - ./icons:/icons:ro # your own icon files
      - ./data:/data:rw # downloaded icon cache; must be writable by uid 1000
    environment:
      # Container status for services with `container:` (docker.host in config.yaml overrides this).
      DOCKER_HOST: tcp://docker-proxy:2375
    networks:
      - default # outbound: service checks and icon downloads
      - docker-api # reaches the socket proxy only
    depends_on:
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Hardening: read-only root filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  # Read-only gateway to the Docker API: only container list/inspect (GET) is allowed.
  # Mounting docker.sock straight into the dashboard would give it root-level control of the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api # no internet access, not published on the host
    healthcheck:
      # Asks Docker for its version through the proxy: proves the socket is reachable.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /run:size=8m
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped

networks:
  docker-api:
    internal: true
